name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - run: chmod +x ./gradlew ./add-version
      - name: Build versions that have been added
        run: |
          if ! find fabric/versions forge/versions neoforge/versions -name gradle.properties -print -quit | grep -q .; then
            echo "No Minecraft versions yet."
            exit 0
          fi
          ./gradlew buildAndCollectAll --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/
          if-no-files-found: ignore
